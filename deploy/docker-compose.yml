# docker-compose.yml — self-host the ytapp backend (for the Android app + any web client)
#   docker compose -f deploy/docker-compose.yml up -d --build
# Then point clients at http://<server-ip>:3001 (Settings → API server in the app).
services:
  ytapp-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: ytapp-server:latest
    container_name: ytapp-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      # Optional: uncomment to serve absolute URLs with your public domain
      # PUBLIC_URL: "https://ytapi.example.com"
      # Optional: YouTube cookies (doc: docs/ARCHITECTURE.md §cookies) — improves
      # bot-wall survivability and unlocks age-restricted videos. Handle with care.
      # YOUTUBE_COOKIE: "VISITOR_INFO1_LIVE=…; SID=…"
      URL_SUFFIX: ""
