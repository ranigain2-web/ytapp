name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base:
        description: "Backend API base URL baked into the app (optional — can also be set later in the app's Settings page)"
        required: false
        default: ""
        type: string

jobs:
  build:
    name: Build APK (debug + release-unsigned)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # android-actions/setup-android@v3 installs the legacy `tools` package,
      # which Google removed from the SDK repository (builds started failing
      # 2026-11-05 with "Failed to find package 'tools'"). The ubuntu-latest
      # runner ships a preinstalled SDK — accept licenses and install exactly
      # what Capacitor 7 needs, no third-party action involved.
      - name: Setup Android SDK (preinstalled + explicit packages)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Install frontend deps (includes Capacitor)
        run: bun install --frozen-lockfile

      - name: Build web app (static export)
        env:
          BUILD_MODE: static
          NEXT_PUBLIC_API_BASE: ${{ github.event.inputs.api_base || vars.API_BASE || '' }}
        run: bunx next build

      - name: Add + sync Android platform
        run: |
          [ -d android ] || bunx cap add android
          bunx cap sync android

      - name: Apply app icons
        run: cp -r icons/android/res/* android/app/src/main/res/

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ytapp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: ytapp-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Summary
        run: |
          echo "## Android build complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Debug APK (install directly): artifact \`ytapp-debug-apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- Release APK (unsigned): artifact \`ytapp-release-unsigned-apk\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The APK is **fully standalone** — it talks to YouTube directly from the device (InnerTube API via CapacitorHttp, no companion server, no proxy). A personal yt-api server is optional (Settings → Your server) and unlocks ad-free direct streams." >> $GITHUB_STEP_SUMMARY
