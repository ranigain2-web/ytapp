apply plugin: 'com.android.library'

android {
    namespace 'com.robonuggets.ytplayer'
    compileSdk 35

    defaultConfig {
        minSdk 23
        targetSdk 35
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Media3 (ExoPlayer + media session service) — the whole point of the
    // native engine: playback owned by a foreground service with a real
    // MediaSession, immune to WebView timer starvation when screen-off.
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'androidx.media:media:1.7.0'
}
